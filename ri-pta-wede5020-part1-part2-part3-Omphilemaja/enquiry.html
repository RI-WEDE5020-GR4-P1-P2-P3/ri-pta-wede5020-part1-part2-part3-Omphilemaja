<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get Involved - Community Support Foundation</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <h1>Community Support Foundation</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="enquiry.html" class="active">Enquiry</a></li>
        <li><a href="contact.html">Contact Us</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Volunteer or Partner With Us</h2>
    <p>Fill out the enquiry form below to register as a community volunteer or become a corporate sponsor.</p>

    <form action="#" method="post">
      <label for="fullname">Full Name:</label>
      <input type="text" id="fullname" name="fullname" required>

      <label for="email">Email Address:</label>
      <input type="email" id="email" name="email" required>

      <label for="type">Enquiry Type:</label>
      <select id="type" name="type">
        <option value="volunteer">Become a Volunteer</option>
        <option value="sponsor">Become a Corporate Sponsor</option>
        <option value="general">General Enquiry</option>
      </select>

      <label for="message">Message Details:</label>
      <textarea id="message" name="message" rows="5" required></textarea>

      <button type="submit">Submit Enquiry</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 Community Support Foundation. All Rights Reserved.</p>
  </footer>

</body>
</html>
